<!DOCTYPE html>

<html lang="en">
<head>
<script>
        window.onerror = function(message, source, lineno, colno) {
            var div = document.createElement('div');
            div.style.position = 'fixed'; div.style.top = '0'; div.style.left = '0';
            div.style.width = '100%'; div.style.background = '#ef4444'; div.style.color = 'white';
            div.style.padding = '12px'; div.style.zIndex = '999999'; div.style.fontSize = '12px';
            div.style.wordBreak = 'break-all'; div.style.fontFamily = 'monospace';
            div.innerHTML = '<strong>Fatal Error:</strong> ' + message + '<br><small>' + source + ':' + lineno + ':' + colno + '</small>';
            document.body.appendChild(div);
            return false;
        };
    </script>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>

<script crossorigin="" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        body {
            background: #e5edff;
            background-image:
                radial-gradient(circle at 8% 18%, rgba(255,255,255,0.45) 0%, transparent 30%),
                radial-gradient(circle at 92% 12%, rgba(196,181,253,0.38) 0%, transparent 32%),
                radial-gradient(circle at 10% 82%, rgba(103,232,249,0.25) 0%, transparent 32%),
                linear-gradient(145deg, #c7dcff 0%, #e5edff 48%, #f3e4ff 100%);
            /* Fixed multi-gradient backgrounds repaint while scrolling on many
               Android WebViews. A normal background keeps touch scrolling fluid. */
            background-attachment: scroll;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding-top: env(safe-area-inset-top);
            padding-bottom: 0;
            overscroll-behavior-y: none;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
        }

        .study-header {
            display: flex; align-items: center; gap: 12px;
            padding: 14px clamp(16px, 3vw, 24px);
            background: #e5edff;
            border-bottom: 1px solid rgba(99,102,241,.12);
        }
        .study-header h1 { font-size: clamp(15px, 2vw, 20px); color: #182b56; -webkit-text-fill-color: #182b56 !important; background: none !important; }
        .study-header p { color: #65749a; font-size: 9px; letter-spacing: .13em; margin-top: 5px; }
        .study-explore, .study-menu { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; min-height: 42px; border-radius: 14px; }
        .study-explore { gap: 7px; padding: 0 14px; background: #eef2ff; border: 1px solid #c5d3fa; color: #344cab; font-size: 11px; font-weight: 800; }
        .study-menu { width: 42px; background: #fff; border: 1px solid #d9e2f6; color: #334155; }
        .study-brand-circle { padding: 2px; border-radius: 50%; overflow: hidden; }
        .study-brand-circle img { display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .study-menu-backdrop { position: fixed; inset: 0; z-index: 65; background: rgba(15,23,42,.38); touch-action: none; }
        .study-sidebar { width: min(360px, calc(100vw - 44px)); height: 100dvh; max-height: 100dvh; overscroll-behavior: contain; outline: none; }
        .study-sidebar > div { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
        @media (max-width: 370px) {
            .study-sidebar > div { padding-left: 16px; padding-right: 16px; }
            .study-sidebar .p-5 { padding: 16px; }
            .study-sidebar .gap-4 { gap: 12px; }
            .study-sidebar .h-\[76px\] { width: 56px; height: 56px; }
        }
        @media (max-width: 370px) { .study-header { gap: 8px; padding: 12px; } .study-explore { width: 42px; padding: 0; } .study-explore span { display: none; } }

        .tab-active {
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            color: white !important;
            box-shadow: 0 4px 10px -2px rgba(124, 58, 237, 0.3);
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-inactive {
            background: white;
            color: #475569;
            border: 1px solid rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        .collection-card {
            background: linear-gradient(to right, rgba(255,255,255,0.9), rgba(255,255,255,0.95));
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,1);
            overflow: hidden;
            position: relative;
        }

        .collection-card:active { transform: scale(0.97); }
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        .slide-up { animation: slideUp 0.4s ease forwards; }
        .animate-fade-in { animation: fadeIn 0.25s ease forwards; }
        .animate-slide-in-left { animation: slideInLeft 0.22s ease forwards; }
        .animate-slide-in-right { animation: slideInRight 0.22s ease forwards; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-24px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(24px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .floating-nav {
            border-radius: 30px;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.15);
            z-index: 50;
            padding: 8px 12px;
        }

        @media (max-width: 767px) {
            .floating-nav {
                position: fixed;
                bottom: calc(20px + env(safe-area-inset-bottom));
                left: 50%;
                transform: translateX(-50%);
                width: 92%;
                max-width: 400px;
            }
        }

        .snap-x-container {
            scroll-behavior: smooth;
            scroll-snap-type: x mandatory;
        }

        /* Blur is attractive but expensive on low/mid-range phones. Keep the
           design while avoiding continuous GPU compositing during scrolling. */
        @media (max-width: 767px) {
            .glass-panel, .glass-header {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: rgba(255, 255, 255, 0.96);
            }

            .collection-card { box-shadow: 0 6px 16px -8px rgba(0, 0, 0, 0.13); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="text-slate-800 antialiased">
<div id="root">
<style>
            @keyframes pulse-glow {
                0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(217, 70, 239, 0.4); }
                70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(217, 70, 239, 0); }
                100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(217, 70, 239, 0); }
            }

            @keyframes loading-bar {
                0% { transform: translateX(-100%); }
                100% { transform: translateX(200%); }
            }

            @keyframes fade-in-logo {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }

            .splash-container {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 100vh;
                width: 100vw;
                background:
                    radial-gradient(circle at 50% 42%, rgba(124, 58, 237, 0.34), transparent 32%),
                    radial-gradient(circle at 85% 12%, rgba(59, 130, 246, 0.18), transparent 28%),
                    linear-gradient(145deg, #0b1020, #111a32 55%, #17122e);
                font-family: 'Plus Jakarta Sans', sans-serif;

                top: 0;
                left: 0;
                z-index: 9999;
            }

            .splash-logo {
                width: 76px;
                height: 76px;
                border-radius: 22px;
                overflow: hidden;
                margin-bottom: 20px;
                border: 1px solid rgba(255, 255, 255, 0.16);
                box-shadow: 0 18px 45px rgba(0, 0, 0, 0.32);
                animation: pulse-glow 2s infinite, fade-in-logo 0.5s ease-out;
            }

            .splash-logo img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .splash-title {
                font-weight: 800;
                font-size: 22px;
                color: #ffffff;
                letter-spacing: 1px;
                margin: 0;
                animation: fade-in-logo 0.6s ease-out;
            }

            .splash-subtitle {
                font-weight: 700;
                font-size: 11px;
                color: #c4b5fd;
                text-transform: uppercase;
                letter-spacing: 3px;
                margin-top: 5px;
                animation: fade-in-logo 0.7s ease-out;
            }

            .splash-loader-track {
                margin-top: 40px;
                width: 80px;
                height: 4px;
                background: #e2e8f0;
                border-radius: 4px;
                overflow: hidden;
                animation: fade-in-logo 0.8s ease-out;
            }

            .splash-loader-thumb {
                width: 50%;
                height: 100%;
                background: linear-gradient(90deg, #6366f1, #d946ef);
                border-radius: 4px;
                animation: loading-bar 1s infinite ease-in-out;
            }
        </style>
<div class="splash-container">
<div class="splash-logo">
<img alt="Akki Study X" src="https://imgyx.pages.dev/OMvAm"/>
</div>

<p class="splash-subtitle">Premium Edition</p>
